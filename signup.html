<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Figma Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="login-box">

        <button class="close">×</button>

        <h1>Welcome to Figma</h1>


        <!-- Google Button -->

        <button class="google-btn">
            <span>G</span>
            Continue with Google
        </button>


        <div class="or">
            <span>or</span>
        </div>


        <!-- Email -->

        <div class="mb-3">

            <label>Email</label>

            <input type="email"
                class="form-control"
                placeholder="EMAIL">

        </div>


        <!-- Continue Button -->

        <button class="continue-btn">
            Continue with email
        </button>

    </div>

</body>

</html>
